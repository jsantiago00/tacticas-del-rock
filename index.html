<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tácticas del Rock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#110d12; --panel:#1c171e; --panel2:#262028; --line:#3a3140;
  --text:#f1e8de; --muted:#9b8f9a; --accent:#ff4d2e; --gold:#f5c542;
  --mine:#4aa3ff; --foe:#ff4d4d;
  --c1:#8f949c; --c2:#3fb15f; --c3:#3a86e0; --c4:#b05ae0; --c5:#f0b02a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(ellipse at 50% 0%,#2a1620 0%,var(--bg) 60%) fixed;
  color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px;
  user-select:none;-webkit-user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 12px}
button:hover:not(:disabled){border-color:#6a5a72;background:#30283a}
button:disabled{opacity:.45;cursor:default}
#app{display:flex;flex-direction:column;min-height:100vh;max-width:1400px;margin:0 auto;padding:8px 16px 16px}

/* ---------- topbar ---------- */
#topbar{display:flex;align-items:center;gap:16px;padding:6px 0 10px}
.logo{font-family:'Bebas Neue',Impact,sans-serif;font-size:34px;letter-spacing:2px;line-height:1;color:var(--accent);text-shadow:0 0 18px #ff4d2e55}
.logo span{color:var(--text);font-size:22px}
#roundInfo{font-family:'Bebas Neue',Impact,sans-serif;font-size:24px;letter-spacing:1px;color:var(--gold)}
#roundInfo small{font-family:Inter;font-size:12px;color:var(--muted);letter-spacing:0;margin-left:8px}
.spacer{flex:1}

/* ---------- main ---------- */
#main{display:grid;grid-template-columns:230px 1fr 250px;gap:16px;flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.panel h3{margin:0 0 8px;font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:20px;letter-spacing:1px;color:var(--muted)}
#center{display:flex;flex-direction:column;align-items:center;gap:10px}

/* traits */
.trait{display:flex;align-items:center;gap:8px;padding:6px;border-radius:8px;margin-bottom:4px;background:var(--panel2);opacity:.65}
.trait.on{opacity:1;box-shadow:inset 3px 0 0 var(--tc,var(--gold))}
.trait .tbadge{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:#0006;font-size:16px;flex:none}
.trait .tname{font-weight:600;font-size:13px}
.trait .tbp{font-size:11px;color:var(--muted)}
.trait .tbp b{color:var(--gold)}
.trait .tnext{font-size:10px;color:var(--muted)}
.trait .tcount{margin-left:auto;font-weight:800}

/* arena (canvas) */
#arenaWrap{position:relative}
#arena{display:block;touch-action:none}
#capBadge{position:absolute;right:-6px;bottom:-4px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:800}
#capBadge.full{color:var(--gold)}
#oppLabel{position:absolute;left:50%;top:-2px;transform:translate(-50%,-100%);font-family:'Bebas Neue',Impact,sans-serif;font-size:20px;letter-spacing:1px;color:var(--foe);white-space:nowrap}
#banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:'Bebas Neue',Impact,sans-serif;font-size:64px;letter-spacing:3px;pointer-events:none;text-shadow:0 4px 24px #000;display:none;text-align:center;line-height:.95;white-space:nowrap}
#banner small{display:block;font-size:26px;color:var(--text)}
#combatCtrls{position:absolute;right:-4px;top:0;display:none;flex-direction:column;gap:6px}
#combatCtrls button{padding:4px 10px;font-size:12px}
#combatCtrls button.on{border-color:var(--gold);color:var(--gold)}

/* HTML token (banco y "fantasma" al arrastrar) */
.unit{position:absolute;width:56px;height:56px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--ub,#333) center/cover;border:3px solid var(--cc,#888);cursor:grab;box-shadow:0 3px 8px #0009;line-height:1}
.unit .u-icon{font-size:17px}
.unit .u-name{font-size:10px;font-weight:800;max-width:52px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-shadow:0 1px 2px #000}
.unit .u-stars{position:absolute;bottom:-9px;font-size:11px;color:var(--gold);text-shadow:0 0 3px #000,0 0 3px #000;letter-spacing:-1px}
.unit.dragging{opacity:.25}
.unit.ghost{position:fixed;pointer-events:none;z-index:1000;opacity:.9;transform:scale(1.1)}
.cost1{--cc:var(--c1)} .cost2{--cc:var(--c2)} .cost3{--cc:var(--c3)} .cost4{--cc:var(--c4)} .cost5{--cc:var(--c5)} .cost0{--cc:#555}

/* bench */
#bench{display:flex;gap:6px;padding:8px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.slot{width:62px;height:62px;border-radius:10px;background:#0004;border:1px dashed var(--line);position:relative}
.slot.drop-hover{border-color:var(--gold);background:#5b4a2a55}
.slot .unit{left:50%;top:50%;transform:translate(-50%,-50%)}

/* panel de partida */
.bighp{display:flex;align-items:baseline;gap:8px}
.bighp b{font-family:'Bebas Neue',Impact,sans-serif;font-size:40px;line-height:1}
.hpbar{height:10px;border-radius:5px;background:#0008;overflow:hidden;margin:4px 0 8px}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#4fd36a,#b6f06a)}
.hist{font-size:12px;max-height:190px;overflow:auto}
.hist div{display:flex;justify-content:space-between;gap:6px;padding:3px 0;border-bottom:1px solid #ffffff0d}
.hist .w{color:#6dff8a} .hist .l{color:var(--foe)} .hist .d{color:var(--gold)}
#infoPanel{margin-top:12px;min-height:120px}
.info-title{font-family:'Bebas Neue',Impact,sans-serif;font-size:24px;letter-spacing:1px;line-height:1}
.info-sub{color:var(--muted);font-size:12px;margin:2px 0 8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:12px;margin-bottom:8px}
.stats span{color:var(--muted)}
.ability{background:var(--panel2);border-radius:8px;padding:8px;font-size:12px;line-height:1.4}
.ability b{color:var(--gold)}
.ability .cur{color:var(--text);font-weight:800;text-decoration:underline}

/* hud */
#hud{display:grid;grid-template-columns:210px auto 1fr auto;gap:12px;align-items:stretch;margin-top:14px}
#hud.disabled #shop,#hud.disabled .hbtns{opacity:.5;pointer-events:none}
.hbtns{display:flex;flex-direction:column;gap:6px;justify-content:center}
.hbtns button{min-width:150px;text-align:left}
.hbtns button kbd{float:right;opacity:.6;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:8px}
#stats .lv{font-family:'Bebas Neue',Impact,sans-serif;font-size:28px;letter-spacing:1px;line-height:1}
.xpbar{height:8px;background:#0008;border-radius:4px;overflow:hidden;margin:4px 0}
.xpbar i{display:block;height:100%;background:#4aa3ff}
.goldv{font-family:'Bebas Neue',Impact,sans-serif;font-size:34px;color:var(--gold);line-height:1}
.small{font-size:11px;color:var(--muted)}
.odds{display:flex;gap:6px;font-size:11px;font-weight:600}
#shop{display:flex;gap:8px;padding:8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);position:relative}
#shop.sell-hover{border-color:var(--accent);background:#3a1a16}
#shop.sell-hover::after{content:'SOLTÁ PARA VENDER';position:absolute;inset:0;display:grid;place-items:center;font-family:'Bebas Neue',Impact,sans-serif;font-size:28px;letter-spacing:2px;color:var(--accent);background:#1c0d0bcc;border-radius:12px}
.card{flex:1;min-width:0;height:98px;border-radius:10px;border:2px solid var(--cc);background:linear-gradient(160deg,var(--ub,#333) 0%,#140f15 85%);padding:7px 8px;cursor:pointer;position:relative;display:flex;flex-direction:column;justify-content:space-between;transition:transform .08s}
.card:hover{transform:translateY(-3px)}
.card.empty{border:2px dashed var(--line);background:none;cursor:default}
.card.empty:hover{transform:none}
.card .cn{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:24px}
.card .ct{font-size:11px;color:#ddd;line-height:1.35}
.card .cc{position:absolute;right:7px;bottom:6px;font-weight:800;color:var(--gold)}
.card .ci{position:absolute;right:6px;top:4px;font-size:22px;opacity:.85}
.card.owned{box-shadow:0 0 0 2px #fff4,0 0 14px #fff3}
.card.owned2{box-shadow:0 0 0 2px var(--gold),0 0 18px var(--gold)}
.card.poor{filter:grayscale(.7) brightness(.7)}
#btnReady{background:linear-gradient(180deg,#ff5a36,#c02a14);border-color:#ff7a5a;font-family:'Bebas Neue',Impact,sans-serif;font-size:24px;letter-spacing:1px;padding:8px 18px}
#btnLock.on{border-color:var(--gold);color:var(--gold)}
.timerRow{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
#timerVal{margin-left:auto;font-weight:800;color:var(--gold)}

/* misc */
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#2a1414;border:1px solid var(--accent);padding:8px 16px;border-radius:8px;display:none;z-index:2000;font-weight:600}
#modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:1500}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(440px,92vw)}
#modal h2{margin:0 0 12px;font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:34px;letter-spacing:1px;color:var(--accent)}
#modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
#modal input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#0006;color:var(--text);font:inherit}
#modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.help{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5}

@media (max-width:1150px){
  #main{grid-template-columns:1fr}
  #hud{grid-template-columns:1fr 1fr}
  #shop{grid-column:1/-1}
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="logo">TÁCTICAS <span>DEL</span> ROCK</div>
    <div id="roundInfo"></div>
    <div class="spacer"></div>
    <button id="btnDet" title="Corre el mismo combate 2 veces con la misma semilla y compara">🔬 Determinismo</button>
    <button id="btnNew">Nueva partida</button>
  </header>
  <div id="main">
    <aside class="panel" id="traitsPanel"></aside>
    <section id="center">
      <div id="arenaWrap">
        <div id="oppLabel"></div>
        <canvas id="arena"></canvas>
        <div id="banner"></div>
        <div id="combatCtrls">
          <button data-speed="1" class="on">x1</button>
          <button data-speed="2">x2</button>
          <button data-speed="4">x4</button>
          <button data-speed="skip">Saltar</button>
        </div>
        <div id="capBadge"></div>
      </div>
      <div id="bench"></div>
    </section>
    <aside>
      <div class="panel" id="gamePanel"></div>
      <div class="panel" id="infoPanel"></div>
    </aside>
  </div>
  <footer id="hud">
    <div class="panel" id="stats"></div>
    <div class="hbtns">
      <button id="btnXp">Comprar XP (4)<kbd>F</kbd></button>
      <button id="btnReroll">Reroll (2)<kbd>D</kbd></button>
    </div>
    <div id="shop" data-drop="sell"></div>
    <div class="hbtns">
      <button id="btnLock">🔓 Bloquear tienda</button>
      <button id="btnReady">¡Listo! <kbd>Espacio</kbd></button>
      <label class="timerRow"><input type="checkbox" id="chkTimer"> Timer<span id="timerVal"></span></label>
    </div>
  </footer>
</div>
<div id="toast"></div>
<div id="modal"><div class="box">
  <h2>Nueva partida</h2>
  <label for="inName">Tu nombre</label>
  <input id="inName" maxlength="18" value="Vos">
  <label for="inSeed">Semilla (misma semilla + mismas jugadas = misma partida)</label>
  <input id="inSeed">
  <div class="help">Arrastrá unidades entre banco y tablero. Para vender: click derecho, arrastrar a la tienda, o <b>E</b> con el mouse encima.<br>
  <b>D</b> reroll · <b>F</b> comprar XP · <b>Espacio</b> listo.</div>
  <div class="row"><button id="btnCancel">Cancelar</button><button id="btnStart" style="border-color:var(--accent)">Arrancar</button></div>
</div></div>

<script src="sim.js"></script>
<script>
'use strict';
/* =====================================================================
 * 2b. BOTS — Etapa 2. Van a usar solo SIM.applyAction, igual que un humano.
 * ===================================================================== */

/* =====================================================================
 * 3. UI — render (canvas para el tablero/combate, HTML para el resto) y
 *    entrada. Solo lee el estado y despacha acciones a SIM.
 * ===================================================================== */
(function UI() {
  if (typeof document === 'undefined') return;
  const C = DATA.CONFIG, ROWS = C.BOARD_ROWS, COLS = C.BOARD_COLS, TROWS = ROWS * 2;
  const HW = 66, HH = Math.round(HW * 1.1547), VS = HH * 0.75, PAD = 18;
  const ARENA_W = COLS * HW + HW / 2, ARENA_H = (TROWS - 1) * VS + HH + PAD * 2;
  const TOKEN_R = 26;
  const SAVE_KEY = 'tacticas_rock_save_v2', PREF_KEY = 'tacticas_rock_prefs';
  const HUMAN = 'p0';
  const $ = s => document.querySelector(s);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const CLASS_ICON = { guitarrista: '🎸', voz: '🎤', bajista: '🪕', baterista: '🥁', tecladista: '🎹' };
  const COST_COLOR = ['#555', '#8f949c', '#3fb15f', '#3a86e0', '#b05ae0', '#f0b02a'];

  let state = null;
  let mode = 'planning';   // 'planning' | 'combat' | 'ended'
  let selected = null;     // {unitId, star}
  let hoverLoc = null;
  let replay = null;
  let drag = null, dragOverIdx = -1;
  let prefs = { timer: false };
  let timerEnd = 0;

  const me = () => state.players[HUMAN];
  const cellCenter = (R, Cc) => ({ x: Cc * HW + (R & 1) * HW / 2 + HW / 2, y: PAD + R * VS + HH / 2 });
  const unitIcon = d => d.icon || CLASS_ICON[d.traits.find(t => CLASS_ICON[t])] || '🎵';
  const originColor = d => { const o = d.traits.find(t => DATA.TRAITS[t].kind === 'origen'); return o ? DATA.TRAITS[o].color : '#666'; };
  const stars = n => '★'.repeat(n);

  // ---------- persistencia ----------
  function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {} }
  function load() { try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); return s && s.v === 2 ? s : null; } catch (e) { return null; } }
  try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY)) || {}); } catch (e) {}
  const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {} };

  function newGame(name, seed) {
    state = SIM.createGame({ seed, players: [{ id: HUMAN, name: name || 'Vos', isBot: false }] });
    mode = 'planning'; selected = null; replay = null;
    $('#banner').style.display = 'none';
    save(); render(); resetTimer();
  }

  // ---------- acciones ----------
  let toastTimer = null;
  function toast(msg, ms = 1600) {
    const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.style.display = 'none'), ms);
  }
  function act(action) {
    if (mode !== 'planning') return;
    const err = SIM.validateAction(state, HUMAN, action);
    if (err) { toast(err); return; }
    state = SIM.applyAction(state, HUMAN, action);
    save(); render();
  }

  // ---------- canvas ----------
  const cv = $('#arena'), ctx = cv.getContext('2d');
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  cv.width = ARENA_W * dpr; cv.height = ARENA_H * dpr;
  cv.style.width = ARENA_W + 'px'; cv.style.height = ARENA_H + 'px';
  ctx.scale(dpr, dpr);
  const IMG = {};
  function getImg(src) {
    if (!src) return null;
    if (!IMG[src]) { IMG[src] = new Image(); IMG[src].src = src; }
    const i = IMG[src];
    return i.complete && i.naturalWidth ? i : null;
  }
  function hexPath(x, y, r) {
    ctx.beginPath();
    for (let k = 0; k < 6; k++) {
      const a = Math.PI / 180 * (60 * k - 90);
      const px = x + r * Math.cos(a), py = y + r * Math.sin(a);
      k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
  }
  function drawHexes(planning) {
    for (let R = 0; R < TROWS; R++) for (let Cc = 0; Cc < COLS; Cc++) {
      const { x, y } = cellCenter(R, Cc);
      const mine = R >= ROWS, idx = (R - ROWS) * COLS + Cc;
      hexPath(x, y, HH / 2 - 2);
      ctx.fillStyle = planning
        ? (mine ? ((R + Cc) & 1 ? '#3a3042' : '#2e2634') : '#1f1920')
        : (mine ? '#2a2330' : '#2a2026');
      if (planning && drag && mine && idx === dragOverIdx) ctx.fillStyle = '#5b4a2a';
      ctx.fill();
    }
    const y = PAD + ROWS * VS + HH / 8;
    const g = ctx.createLinearGradient(0, 0, ARENA_W, 0);
    g.addColorStop(0, 'transparent'); g.addColorStop(0.5, '#ff4d2e88'); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.fillRect(0, y - 1, ARENA_W, 2);
  }
  function fitText(text, maxW) {
    if (ctx.measureText(text).width <= maxW) return text;
    while (text.length > 1 && ctx.measureText(text + '…').width > maxW) text = text.slice(0, -1);
    return text + '…';
  }
  // o: {side:'mine'|'foe', hp, shield, mana (0..1), flash, scale, alpha}
  function drawToken(x, y, unitId, star, o = {}) {
    const d = SIM.def(unitId), r = TOKEN_R * (o.scale || 1);
    ctx.save();
    ctx.globalAlpha = o.alpha ?? 1;
    if (o.side) { ctx.beginPath(); ctx.arc(x, y, r + 5, 0, Math.PI * 2); ctx.fillStyle = o.side === 'mine' ? '#4aa3ff' : '#ff4d4d'; ctx.fill(); }
    ctx.beginPath(); ctx.arc(x, y, r + 3, 0, Math.PI * 2); ctx.fillStyle = COST_COLOR[d.cost]; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = '#1d171e'; ctx.fill();
    const img = getImg(d.img);
    if (img) {
      ctx.save(); ctx.clip(); ctx.drawImage(img, x - r, y - r, r * 2, r * 2); ctx.restore();
    } else {
      ctx.fillStyle = originColor(d) + '77'; ctx.fill();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '16px "Segoe UI Emoji","Apple Color Emoji",sans-serif';
      ctx.fillText(unitIcon(d), x, y - 7);
      ctx.font = '800 10px Inter,system-ui,sans-serif';
      ctx.fillStyle = '#fff'; ctx.shadowColor = '#000'; ctx.shadowBlur = 3;
      ctx.fillText(fitText(d.short, r * 2 - 6), x, y + 11);
      ctx.shadowBlur = 0;
    }
    if (o.flash) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = `rgba(255,255,255,${o.flash * 0.6})`; ctx.fill(); }
    ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#f5c542'; ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
    ctx.fillText(stars(star), x, y + r + 4);
    ctx.shadowBlur = 0;
    if (o.hp != null) { // barras
      const w = 56, bx = x - w / 2, by = y - r - 15;
      ctx.fillStyle = '#000b'; ctx.fillRect(bx, by, w, 6);
      ctx.fillStyle = o.side === 'foe' ? '#ff5a4a' : '#4fd36a'; ctx.fillRect(bx, by, w * o.hp, 6);
      if (o.shield > 0) { ctx.fillStyle = '#e8e8e8cc'; ctx.fillRect(bx + w * o.hp, by, w * Math.min(1 - o.hp, o.shield), 6); }
      if (o.mana != null) { ctx.fillStyle = '#000b'; ctx.fillRect(bx, by + 7, w, 3); ctx.fillStyle = '#4aa3ff'; ctx.fillRect(bx, by + 7, w * o.mana, 3); }
    }
    ctx.restore();
  }
  function drawPlanning() {
    drawHexes(true);
    me().board.forEach((u, i) => {
      if (!u) return;
      const { x, y } = cellCenter(ROWS + Math.floor(i / COLS), i % COLS);
      const dragging = drag && drag.ghost && drag.zone === 'board' && drag.idx === i;
      drawToken(x, y, u.unitId, u.star, { alpha: dragging ? 0.25 : 1 });
    });
  }

  // ---------- render HTML ----------
  function makeTokenEl(unitId, star) {
    const d = SIM.def(unitId);
    const t = el('div', `unit cost${d.cost}`, d.img ? `<div class="u-stars">${stars(star)}</div>`
      : `<div class="u-icon">${unitIcon(d)}</div><div class="u-name">${d.short}</div><div class="u-stars">${stars(star)}</div>`);
    t.style.setProperty('--ub', d.img ? `url("${d.img}")` : originColor(d) + '66');
    return t;
  }
  function render() {
    renderTop(); renderTraits(); renderGamePanel(); renderInfo(); renderHud(); renderShop(); renderBench();
    $('#combatCtrls').style.display = mode === 'combat' ? 'flex' : 'none';
    const cap = $('#capBadge'), n = SIM.boardCount(me());
    cap.style.display = mode === 'combat' ? 'none' : '';
    cap.textContent = `${n}/${me().level}`;
    cap.classList.toggle('full', n >= me().level);
    if (mode !== 'combat') $('#oppLabel').textContent = '';
  }
  function renderTop() {
    const label = SIM.roundLabel(state.round);
    const kind = DATA.PVE[label] ? 'PvE · ' + DATA.PVE[label].name : 'Rival generado';
    $('#roundInfo').innerHTML = `Ronda ${label}<small>${kind}</small>`;
  }
  function traitLevelsText(T) {
    const names = { hp: 'Vida', armor: 'Armadura', mr: 'Res. mágica', ap: '% Poder hab.', adPct: '% Daño', asPct: '% Vel. ataque', lifesteal: '% Robo de vida', manaRegen: 'Maná/s', shield: 'Escudo' };
    return T.levels.map((lv, i) => `(${T.breakpoints[i]}) ` + Object.entries(lv).map(([k, v]) => `+${v} ${names[k] || k}`).join(', ')).join('\n');
  }
  function renderTraits() {
    const tr = SIM.computeTraits(SIM.boardSnapshot(me()));
    const box = $('#traitsPanel'); box.innerHTML = '<h3>Rasgos</h3>';
    const keys = Object.keys(tr).sort((a, b) => (tr[b].level >= 0) - (tr[a].level >= 0) || tr[a].missing - tr[b].missing || tr[b].count - tr[a].count);
    if (!keys.length) box.appendChild(el('div', 'small', 'Poné unidades en el tablero para activar rasgos.'));
    for (const k of keys) {
      const T = DATA.TRAITS[k], { count, level, next, missing } = tr[k];
      const bp = T.breakpoints.map((b, i) => (i <= level ? `<b>${b}</b>` : b)).join(' › ');
      const nextTxt = next ? `falta${missing > 1 ? 'n' : ''} ${missing} para ${next}` : 'máximo';
      const row = el('div', 'trait' + (level >= 0 ? ' on' : ''),
        `<div class="tbadge">${T.icon}</div><div><div class="tname">${T.name}</div><div class="tbp">${bp}</div><div class="tnext">${nextTxt}</div></div><div class="tcount">${count}</div>`);
      row.style.setProperty('--tc', T.color);
      row.title = `${T.name} (${T.kind})\n${T.desc}\n${traitLevelsText(T)}`;
      box.appendChild(row);
    }
  }
  function renderGamePanel() {
    const p = me();
    const sk = p.streak >= 2 ? `🔥 Racha de ${p.streak} victorias` : p.streak <= -2 ? `🧊 Racha de ${-p.streak} derrotas` : '';
    const hist = p.history.map(h => `<div><span>${h.round} · ${h.vs}</span><span class="${h.result[0]}">${h.result === 'win' ? 'Victoria' : h.result === 'draw' ? 'Empate' : 'Derrota'}${h.dmg ? ' -' + h.dmg : ''}</span></div>`).join('');
    $('#gamePanel').innerHTML = `<h3>${p.name}</h3>
      <div class="bighp"><b>${Math.max(0, p.hp)}</b><span class="small">de vida</span></div>
      <div class="hpbar"><i style="width:${Math.max(0, p.hp)}%"></i></div>
      <div class="small" style="margin-bottom:6px">${sk || '&nbsp;'}</div>
      <div class="hist">${hist || '<span class="small">Todavía no hubo peleas.</span>'}</div>`;
  }
  function abilityText(ab, star) {
    if (!ab) return 'Sin habilidad.';
    const v = arr => (Array.isArray(arr) ? arr.map((x, i) => (i === star - 1 ? `<span class="cur">${x}</span>` : x)).join('/') : arr);
    const stun = ab.stun ? ` y aturde ${v(ab.stun)}s` : '';
    switch (ab.type) {
      case 'nuke': return `Golpea a su objetivo por <b>${v(ab.dmg)}</b> de daño mágico${stun}.`;
      case 'aoe': return `<b>${v(ab.dmg)}</b> de daño mágico a los enemigos a ${ab.radius || 1} hex de ${ab.center === 'self' ? 'sí mismo' : 'su objetivo'}${stun}.`;
      case 'multi': return `Golpea a ${ab.count} enemigos al azar por <b>${v(ab.dmg)}</b> de daño mágico${stun}.`;
      case 'all': return `Golpea a TODOS los enemigos por <b>${v(ab.dmg)}</b> de daño mágico${stun}.`;
      case 'push': return `Golpea a su objetivo por <b>${v(ab.dmg)}</b> y lo empuja ${ab.distance || 1} hex${stun}.`;
      case 'shield': return `Se pone un escudo de <b>${v(ab.amount)}</b> durante ${ab.duration}s.`;
      case 'teamShield': return `Escudo de <b>${v(ab.amount)}</b> a todo el equipo durante ${ab.duration}s.`;
      case 'heal': return `Cura <b>${v(ab.amount)}</b> a ${ab.count > 1 ? `los ${ab.count} aliados más heridos` : 'el aliado más herido'}.`;
      case 'healAll': return `Cura <b>${v(ab.amount)}</b> a todo el equipo.`;
      case 'buffAS': return `Gana <b>+${v(ab.pct)}%</b> de velocidad de ataque durante ${ab.duration}s.`;
      case 'teamBuffAS': return `Todo el equipo gana <b>+${v(ab.pct)}%</b> de velocidad de ataque durante ${ab.duration}s.`;
    }
    return '';
  }
  function renderInfo() {
    const box = $('#infoPanel');
    if (!selected) { box.innerHTML = '<h3>Info</h3><div class="small">Hacé click en una unidad o pasá el mouse por la tienda.</div>'; return; }
    const d = SIM.def(selected.unitId), s = selected.star, m = C.STAR_MULT[s - 1];
    const traits = d.traits.map(t => DATA.TRAITS[t].icon + ' ' + DATA.TRAITS[t].name).join(' · ');
    box.innerHTML = `<div class="info-title">${d.name} <span style="color:var(--gold)">${stars(s)}</span></div>
      <div class="info-sub">${d.cost ? `Coste ${d.cost}` : 'PvE'} · ${traits || '—'}</div>
      <div class="stats">
        <div><span>Vida</span> ${Math.round(d.hp * m)}</div><div><span>Daño</span> ${Math.round(d.ad * m)}</div>
        <div><span>Vel. ataque</span> ${d.as}</div><div><span>Rango</span> ${d.range}</div>
        <div><span>Armadura</span> ${d.armor}</div><div><span>Res. mág.</span> ${d.mr}</div>
        ${d.ability ? `<div><span>Maná</span> ${d.startMana}/${d.maxMana}</div>` : ''}
      </div>
      ${d.ability ? `<div class="ability"><b>${d.ability.name}</b><br>${abilityText(d.ability, s)}</div>` : ''}`;
  }
  function renderHud() {
    const p = me();
    $('#hud').classList.toggle('disabled', mode !== 'planning');
    const need = SIM.xpNeeded(p), inc = SIM.incomePreview(p), max = p.level >= C.MAX_LEVEL;
    const odds = DATA.SHOP_ODDS[p.level].map((o, i) => `<span style="color:var(--c${i + 1})">${o}%</span>`).join('');
    $('#stats').innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-end">
        <div><div class="lv">Nivel ${p.level}</div><div class="small">${max ? 'MAX' : `${p.xp}/${need} XP`}</div></div>
        <div class="goldv">🪙 ${p.gold}</div>
      </div>
      <div class="xpbar"><i style="width:${max ? 100 : (p.xp / need) * 100}%"></i></div>
      <div class="odds">${odds}</div>
      <div class="small" style="margin-top:4px">Próx. ingreso: +${inc.total} (${inc.base} base + ${inc.interest} int. + ${inc.streak} racha)</div>`;
    $('#btnXp').disabled = p.gold < C.XP_COST || max;
    $('#btnReroll').disabled = p.gold < C.REROLL_COST;
    const lock = $('#btnLock');
    lock.classList.toggle('on', p.shopLocked);
    lock.textContent = p.shopLocked ? '🔒 Tienda bloqueada' : '🔓 Bloquear tienda';
  }
  function renderShop() {
    const p = me(), box = $('#shop'); box.innerHTML = '';
    p.shop.forEach((id, i) => {
      if (!id) { box.appendChild(el('div', 'card empty')); return; }
      const d = DATA.UNITS[id];
      const have = SIM.countCopies(p, id, 1);
      const card = el('div', `card cost${d.cost}` + (have >= 2 ? ' owned2' : have === 1 ? ' owned' : '') + (p.gold < d.cost ? ' poor' : ''),
        `<div class="ci">${unitIcon(d)}</div><div class="cn">${d.short}</div>
         <div class="ct">${d.traits.map(t => DATA.TRAITS[t].icon + ' ' + DATA.TRAITS[t].name).join('<br>')}</div>
         <div class="cc">🪙${d.cost}</div>`);
      card.style.setProperty('--ub', originColor(d) + '66');
      card.addEventListener('click', () => act({ type: 'BUY', slot: i }));
      card.addEventListener('pointerenter', () => { selected = { unitId: id, star: 1 }; renderInfo(); });
      box.appendChild(card);
    });
  }
  function renderBench() {
    const p = me(), box = $('#bench'); box.innerHTML = '';
    p.bench.forEach((u, i) => {
      const slot = el('div', 'slot');
      slot.dataset.drop = 'bench'; slot.dataset.idx = i;
      if (u) {
        const t = makeTokenEl(u.unitId, u.star);
        t.dataset.zone = 'bench'; t.dataset.idx = i;
        slot.appendChild(t);
      }
      box.appendChild(slot);
    });
  }

  // ---------- entrada: arrastrar, vender, teclado ----------
  function canvasPoint(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function boardIdxAt(e) { // celda de MI mitad bajo el puntero, o -1
    const { x, y } = canvasPoint(e);
    let best = -1, bd = HW * 0.55;
    for (let i = 0; i < ROWS * COLS; i++) {
      const c = cellCenter(ROWS + Math.floor(i / COLS), i % COLS), d = Math.hypot(c.x - x, c.y - y);
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }
  function boardUnitAt(e) { // índice de una unidad mía del tablero bajo el puntero
    const { x, y } = canvasPoint(e);
    return me().board.findIndex((u, i) => {
      if (!u) return false;
      const c = cellCenter(ROWS + Math.floor(i / COLS), i % COLS);
      return Math.hypot(c.x - x, c.y - y) <= TOKEN_R + 3;
    });
  }
  function locAt(e) { // origen de arrastre bajo el puntero
    if (e.target === cv) { const i = boardUnitAt(e); return i >= 0 ? { zone: 'board', idx: i } : null; }
    const t = e.target.closest && e.target.closest('.unit[data-zone]');
    return t ? { zone: t.dataset.zone, idx: +t.dataset.idx } : null;
  }
  function combatUnitAt(e) {
    if (!replay || e.target !== cv) return null;
    const { x, y } = canvasPoint(e);
    return replay.cs.units.find(u => u.alive && (p => Math.hypot(p.x - x, p.y - y) <= TOKEN_R)(unitXY(u, replay.alpha))) || null;
  }
  const unitAtLoc = loc => (loc.zone === 'bench' ? me().bench : me().board)[loc.idx];
  let benchHover = null;
  function setBenchHover(t) {
    if (benchHover === t) return;
    if (benchHover) benchHover.classList.remove('drop-hover', 'sell-hover');
    benchHover = t;
    if (t) t.classList.add(t.dataset.drop === 'sell' ? 'sell-hover' : 'drop-hover');
  }
  function dropAt(e) {
    const t = document.elementFromPoint(e.clientX, e.clientY);
    if (t === cv) { const i = boardIdxAt(e); return i >= 0 ? { zone: 'board', idx: i } : null; }
    const z = t && t.closest('[data-drop]');
    return z ? { zone: z.dataset.drop, idx: +z.dataset.idx, el: z } : null;
  }

  document.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    if (mode === 'combat') { const u = combatUnitAt(e); if (u) { selected = { unitId: u.unitId, star: u.star }; renderInfo(); } return; }
    if (mode !== 'planning') return;
    const loc = locAt(e);
    if (!loc) return;
    drag = { ...loc, sx: e.clientX, sy: e.clientY, ghost: null, el: loc.zone === 'bench' ? e.target.closest('.unit') : null };
    e.preventDefault();
  });
  document.addEventListener('pointermove', e => {
    if (!drag) { hoverLoc = mode === 'planning' ? locAt(e) : null; return; }
    if (!drag.ghost) {
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 5) return;
      const u = unitAtLoc(drag);
      drag.ghost = makeTokenEl(u.unitId, u.star);
      drag.ghost.classList.add('ghost');
      document.body.appendChild(drag.ghost);
      if (drag.el) drag.el.classList.add('dragging');
    }
    drag.ghost.style.left = e.clientX - 28 + 'px';
    drag.ghost.style.top = e.clientY - 28 + 'px';
    const d = dropAt(e);
    dragOverIdx = d && d.zone === 'board' ? d.idx : -1;
    setBenchHover(d && d.el ? d.el : null);
  });
  document.addEventListener('pointerup', e => {
    if (!drag) return;
    const d = drag; drag = null; dragOverIdx = -1;
    setBenchHover(null);
    const from = { zone: d.zone, idx: d.idx };
    if (!d.ghost) { // fue un click
      const u = unitAtLoc(from);
      if (u) { selected = { unitId: u.unitId, star: u.star }; renderInfo(); }
      return;
    }
    d.ghost.remove();
    if (d.el) d.el.classList.remove('dragging');
    const to = dropAt(e);
    if (!to) return;
    if (to.zone === 'sell') act({ type: 'SELL', loc: from });
    else act({ type: 'MOVE', from, to: { zone: to.zone, idx: to.idx } });
  });
  document.addEventListener('contextmenu', e => { // click derecho = vender
    if (mode !== 'planning') return;
    const loc = locAt(e);
    if (loc) { e.preventDefault(); act({ type: 'SELL', loc }); }
  });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || $('#modal').style.display === 'grid') return;
    const k = e.key.toLowerCase();
    if (k === 'd') act({ type: 'REROLL' });
    else if (k === 'f') act({ type: 'BUY_XP' });
    else if (k === 'e' && hoverLoc) { act({ type: 'SELL', loc: hoverLoc }); hoverLoc = null; }
    else if (k === ' ') { e.preventDefault(); onReady(); }
  });

  // ---------- timer de planificación (solo UI; en la Etapa 3 lo maneja el host) ----------
  function resetTimer() { timerEnd = performance.now() + C.PLANNING_SECONDS * 1000; }
  function tickTimer(now) {
    const lbl = $('#timerVal');
    if (!prefs.timer || mode !== 'planning') { lbl.textContent = ''; return; }
    const left = Math.max(0, Math.ceil((timerEnd - now) / 1000));
    lbl.textContent = left + 's';
    if (left <= 0 && !drag) onReady();
  }

  // ---------- ronda y combate ----------
  function onReady() {
    if (mode !== 'planning') return;
    const next = SIM.resolveRound(state);
    const entry = next.combats.find(c => c.a === HUMAN);
    if (!entry) { finishRound(next); return; }
    startCombatView(entry, next);
  }
  function startCombatView(entry, next) {
    mode = 'combat';
    selected = null;
    render();
    $('#oppLabel').textContent = 'vs ' + entry.name;
    const cs = SIM.createCombat(entry.snapA, entry.snapB, entry.seed);
    replay = { cs, entry, next, acc: 0, alpha: 0, last: performance.now(), speed: replay?.speed || prefs.speed || 1, finished: false, floaters: [], fx: {} };
    $('#combatCtrls').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.speed == replay.speed));
  }
  function unitXY(u, alpha) {
    const tnow = replay.cs.tick + alpha, span = u.moveEnd - u.moveStart;
    const k = span > 0 ? Math.max(0, Math.min(1, (tnow - u.moveStart) / span)) : 1;
    const a = cellCenter(u.fromR, u.fromC), b = cellCenter(u.r, u.c);
    return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k };
  }
  function addFloater(cid, text, color, size, now) {
    const p = unitXY(replay.cs.units[cid], 0);
    replay.floaters.push({ x: p.x + (Math.random() * 20 - 10), y: p.y - 20, text, color, size, born: now });
  }
  function handleEvents(events, now) {
    const rp = replay, fx = id => (rp.fx[id] ||= { flash: 0, pulse: 0, died: 0 });
    const many = rp.speed > 2;
    for (const ev of events) {
      if (ev.t === 'atk') fx(ev.s).pulse = now;
      else if (ev.t === 'dmg') { fx(ev.d).flash = now; if (!many) addFloater(ev.d, ev.a, ev.c ? '#ff9a3c' : ev.k === 'magic' ? '#d48cff' : '#ffd9a0', ev.c ? 16 : 13, now); }
      else if (ev.t === 'heal' && !many) addFloater(ev.d, '+' + ev.a, '#6dff8a', 13, now);
      else if (ev.t === 'cast') addFloater(ev.s, ev.n, '#f5c542', 18, now);
      else if (ev.t === 'stun') addFloater(ev.d, '💫', '#fff', 16, now);
      else if (ev.t === 'push') addFloater(ev.d, '¡POGO!', '#ff7a3c', 15, now);
      else if (ev.t === 'die') fx(ev.d).died = now;
    }
  }
  function drawCombat(now) {
    const rp = replay;
    drawHexes(false);
    for (const u of rp.cs.units) {
      const f = rp.fx[u.cid] || {};
      let alpha = 1;
      if (!u.alive) { alpha = 1 - (now - (f.died || 0)) / 400; if (alpha <= 0) continue; }
      const p = unitXY(u, rp.alpha);
      const pulse = f.pulse ? Math.max(0, 1 - (now - f.pulse) / 160) : 0;
      const flash = f.flash ? Math.max(0, 1 - (now - f.flash) / 140) : 0;
      drawToken(p.x, p.y, u.unitId, u.star, {
        side: u.side === 0 ? 'mine' : 'foe', alpha, flash, scale: 1 + pulse * 0.1,
        hp: u.hp / u.maxHp, shield: u.shield / u.maxHp, mana: u.maxMana ? u.mana / u.maxMana : null,
      });
    }
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
    rp.floaters = rp.floaters.filter(fl => now - fl.born < 800);
    for (const fl of rp.floaters) {
      const k = (now - fl.born) / 800;
      ctx.globalAlpha = 1 - k;
      ctx.font = `800 ${fl.size}px ${fl.size >= 18 ? '"Bebas Neue",Impact' : 'Inter,system-ui'},sans-serif`;
      ctx.fillStyle = fl.color;
      ctx.fillText(fl.text, fl.x, fl.y - k * 34);
    }
    ctx.restore();
  }
  function stepReplay(now) {
    const rp = replay;
    if (rp.finished) return;
    const dt = Math.min(0.1, (now - rp.last) / 1000); rp.last = now;
    rp.acc += dt * C.TICK_RATE * rp.speed;
    while (rp.acc >= 1 && !rp.cs.done) { SIM.stepCombat(rp.cs); handleEvents(rp.cs.events, now); rp.acc -= 1; }
    rp.alpha = rp.cs.done ? 0 : rp.acc;
    if (rp.cs.done) endCombat();
  }
  function skipCombat() {
    const rp = replay;
    if (!rp || rp.finished) return;
    while (!rp.cs.done) SIM.stepCombat(rp.cs);
    rp.alpha = 0;
    endCombat();
  }
  function endCombat() {
    const rp = replay;
    if (rp.finished) return;
    rp.finished = true;
    if (rp.cs.hash !== rp.entry.hash) console.error('DESYNC: la re-simulación no coincide con la del host', rp.cs.hash, rp.entry.hash);
    const won = rp.cs.winner === 'A';
    const dmg = me().hp - rp.next.players[HUMAN].hp;
    const b = $('#banner');
    b.style.display = 'block';
    b.style.color = won ? '#6dff8a' : rp.cs.winner === 'draw' ? 'var(--gold)' : 'var(--foe)';
    b.innerHTML = (won ? '¡GANASTE!' : rp.cs.winner === 'draw' ? 'EMPATE' : 'PERDISTE') + (dmg > 0 ? `<small>-${dmg} de vida</small>` : '');
    setTimeout(() => { b.style.display = 'none'; finishRound(rp.next); }, 1500);
  }
  function finishRound(next) {
    state = next; replay = null;
    mode = state.phase === 'ended' || !me().alive ? 'ended' : 'planning';
    save(); render(); resetTimer();
    if (mode === 'ended') {
      const last = me().history[0];
      const b = $('#banner');
      b.style.display = 'block'; b.style.color = 'var(--accent)';
      b.innerHTML = `SE TERMINÓ EL RECITAL<small>Llegaste a la ronda ${last ? last.round : '-'} · "Nueva partida" para otra</small>`;
    }
  }
  $('#combatCtrls').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || !replay) return;
    if (b.dataset.speed === 'skip') { skipCombat(); return; }
    replay.speed = prefs.speed = +b.dataset.speed; savePrefs();
    $('#combatCtrls').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  });

  // ---------- loop de dibujo ----------
  function frame(now) {
    ctx.clearRect(0, 0, ARENA_W, ARENA_H);
    if (state) {
      if (replay) { stepReplay(now); drawCombat(now); } else drawPlanning();
      tickTimer(now);
    }
    requestAnimationFrame(frame);
  }

  // ---------- botones ----------
  $('#btnXp').addEventListener('click', () => act({ type: 'BUY_XP' }));
  $('#btnReroll').addEventListener('click', () => act({ type: 'REROLL' }));
  $('#btnLock').addEventListener('click', () => act({ type: 'LOCK' }));
  $('#btnReady').addEventListener('click', onReady);
  $('#chkTimer').checked = prefs.timer;
  $('#chkTimer').addEventListener('change', e => { prefs.timer = e.target.checked; savePrefs(); resetTimer(); });
  $('#btnDet').addEventListener('click', () => {
    const r = SIM.selfTest(30, 'ui-' + Date.now());
    console.log('SIM.selfTest', r);
    toast(r.ok ? `✔ Determinista: ${r.combats} combates corridos 2 veces, mismo resultado` : `✘ ${r.fails} de ${r.combats} combates difieren (ver consola)`, 3000);
  });
  function openModal() {
    $('#inSeed').value = Math.floor(Math.random() * 1e9).toString(36); // la UI sí puede usar Math.random
    $('#modal').style.display = 'grid';
    $('#inName').focus();
  }
  $('#btnNew').addEventListener('click', () => { if (mode !== 'combat') openModal(); });
  $('#btnCancel').addEventListener('click', () => { if (state) $('#modal').style.display = 'none'; });
  $('#btnStart').addEventListener('click', () => {
    $('#modal').style.display = 'none';
    newGame($('#inName').value.trim(), $('#inSeed').value.trim() || 'rock');
  });

  // ---------- arranque ----------
  window.GAME = { SIM, DATA, get state() { return state; } };
  state = load();
  if (state) {
    mode = state.phase === 'ended' || !me().alive ? 'ended' : 'planning';
    render(); resetTimer();
  } else openModal();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
